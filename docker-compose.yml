services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusnav
      POSTGRES_USER: campusnav
      POSTGRES_PASSWORD: campusnav
    ports:
      - "5432:5432"
    volumes:
      - campusnav_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusnav -d campusnav"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  campusnav_postgres_data:
